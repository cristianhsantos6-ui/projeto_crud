<section id="form">
    <h2>Cadastro de Atleta</h2>

    <div id="atleta">

        <label for="nome">Nome Completo</label>
        <input
            type="text"
            name="nome"
            id="nome"
            class="input01"
            [(ngModel)]="nome"
            maxlength="60"
            required
            placeholder="Digite o nome completo"
        >

        <label for="cpf">CPF</label>
        <input
            type="text"
            name="cpf"
            id="cpf"
            class="input02"
            [(ngModel)]="cpf"
            maxlength="14"
            required
            placeholder="Digite o seu CPF"
        >

        <label for="data_nascimento">Data de Nascimento</label>
        <input
            type="date"
            name="data_nascimento"
            id="data_nascimento"
            [(ngModel)]="data_nascimento"
            required
        >

        <!-- PESO -->
        <label for="peso">Peso (kg)</label>
        <input
            type="number"
            name="peso"
            id="peso"
            class="input02"
            [(ngModel)]="peso"
            min="1"
            required
            placeholder="Digite seu peso"
        >

        <!-- ALTURA -->
        <label for="altura">Altura (m)</label>
        <input
            type="number"
            name="altura"
            id="altura"
            class="input02"
            [(ngModel)]="altura"
            min="0.5"
            max="3"
            step="0.01"
            required
            placeholder="Ex: 1.75"
        >

        <label for="sexo">Sexo</label>

        <input
            type="radio"
            name="sexo"
            id="sexoM"
            class="radio01"
            [(ngModel)]="sexo"
            value="M"
        >
        <label for="sexoM">Masculino</label>

        <input
            type="radio"
            name="sexo"
            id="sexoF"
            class="radio01"
            [(ngModel)]="sexo"
            value="F"
        >
        <label for="sexoF">Feminino</label>

        <input
            type="radio"
            name="sexo"
            id="sexoN"
            class="radio01"
            [(ngModel)]="sexo"
            value="N"
        >
        <label for="sexoN">Não Declarar</label>

        <label for="cep">CEP</label>
        <input
            type="text"
            name="cep"
            id="cep"
            class="input02"
            [(ngModel)]="cep"
            maxlength="9"
            required
            placeholder="Digite o seu CEP"
        >

        <label for="rua_logradouro">Rua/Logradouro</label>
        <input
            type="text"
            name="rua_logradouro"
            id="rua_logradouro"
            class="input01"
            [(ngModel)]="rua_logradouro"
            maxlength="100"
            required
            placeholder="Digite a Rua ou Logradouro"
        >

        <label for="bairro">Bairro</label>
        <input
            type="text"
            name="bairro"
            id="bairro"
            class="input02"
            [(ngModel)]="bairro"
            maxlength="20"
            required
            placeholder="Digite o Bairro"
        >

        <label for="cidade">Cidade</label>
        <input
            type="text"
            name="cidade"
            id="cidade"
            class="input02"
            [(ngModel)]="cidade"
            maxlength="70"
            required
            placeholder="Digite a sua cidade"
        >

        <label for="uf">UF</label>
        <input
            type="text"
            name="uf"
            id="uf"
            class="input02"
            [(ngModel)]="uf"
            maxlength="2"
            required
            placeholder="Ex: SP"
        >

        <div id="div-btns">
            <button type="button" (click)="salvar()">
                Cadastrar
            </button>

            <button
                type="button"
                (click)="limparDados()"
                id="btnLimpar"
            >
                Limpar
            </button>
        </div>

    </div>
</section>
