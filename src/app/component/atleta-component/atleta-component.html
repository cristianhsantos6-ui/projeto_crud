<section id="form">
    <h2>Cadastro de Atleta</h2>
    <div id="atleta">
        <label for="nome">Nome Completo</label>
        <input type="text" name="nome" id="nome" class="input01" [(ngModel)]="nome"
        maxlength="60" required placeholder="Digite o nome Completo">
       
        <label for="cpf">CPF</label>
        <input type="text" name="cpf" id="cpf" class="input02" [(ngModel)]="cpf"
        maxlength="14" required placeholder="Digite o seu CPF">

        <label for="dataNascimento"> Data de Nascimento</label>
        <input type="date" name="data" id="data" [(ngModel)]="dataNascimento">

        <label for="sexo">Sexo</label>
        <input type="radio" name="sexo" id="sexoM" class="radio01" [(ngModel)]="sexo" value="M"> Masculino
        <input type="radio" name="sexo" id="sexoF" class="radio01" [(ngModel)]="sexo" value="F"> Feminino
        <input type="radio" name="sexo" id="sexoN" class="radio01" [(ngModel)]="sexo" value="N"> Não Declarar

        <label for="cep">CEP</label>
        <input type="text" name="cep" id="cep" class="input02" [(ngModel)]="cep"
        maxlength="9" required placeholder="Digite o seu cep">

        <label for="rua-logradouro">Rua/Logradouro</label>
        <input type="text" name="rua-logradouro" id="rua-logradouro" class="input01" [(ngModel)]="ruaLogradouro"
        maxlength="60" required placeholder="Digite a Rua ou Logradouro">

        <label for="Bairro">Bairro</label>
        <input type="text" name="bairro" id="Bairro" class="input02" [(ngModel)]="bairro"
        maxlength="60" required placeholder="Digite o Bairro">

        <label for="cidade">Cidade</label>
        <input type="text" name="cidade" id="cidade" class="input02" [(ngModel)]="cidade"
        maxlength="60" required placeholder="Digite a sua cidade">
       
        <label for="uf">uf</label>
        <input type="text" name="uf" id="uf" class="input02" [(ngModel)]="uf"
         maxlength="60" required placeholder="Digite o seu uf">

        <div id="div-btns">
            <button type="button" (click)="salvar()">Cadastrar</button>
            <button type="button" (click)="limparDados()" id="btnLimpar">Limpar</button>
        </div>
    </div>
</section>
